<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A live logistics command center for a simulated Bangladesh e-commerce shipment network — real-time map, SLA intelligence, and an AI operations assistant." />
    <title>Logistics Command Center</title>
    <script type="text/javascript">
      // Decode the path GitHub Pages' 404.html redirect encoded (see
      // public/404.html) back into a real URL before React mounts, so
      // a direct load of a sub-route resolves to the right page.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
