<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Live Logistics Command Center</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrite for a client-side
      // router, so a direct load / refresh of a sub-route 404s.
      // Standard workaround: encode the path into a query string and
      // redirect to the SPA's real entry point, which decodes it back
      // via history.replaceState before React mounts (see index.html).
      var segmentCount = 1 // matches vite.config.js base: '/logistics-flow-map/'
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
